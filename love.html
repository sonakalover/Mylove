<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Jaanu - 2026</title>
    <style>
        :root {
            --primary-red: #d40000;
            --gold: #ffd700;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            color: white;
            font-family: 'Georgia', serif;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* Countdown Style */
        #countdown {
            font-size: 5rem;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold);
        }

        /* Firecrackers/Overlay Text */
        #fireworks-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #220000, #000);
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .beautified-text {
            font-size: 3rem;
            background: linear-gradient(to right, #fff, var(--gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s infinite;
        }

        /* Modal/Popups */
        .modal {
            display: none;
            position: fixed;
            z-index: 20;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border: 2px solid var(--gold);
            border-radius: 20px;
            text-align: center;
            max-width: 80%;
            transition: opacity 1s ease-out;
        }

        /* 3D Gift Box */
        .box-container {
            display: none;
            perspective: 1000px;
            z-index: 15;
        }

        .gift-box {
            width: 200px; height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(45deg);
            transition: transform 1s;
            cursor: pointer;
        }

        .gift-box div {
            position: absolute;
            width: 200px; height: 200px;
            background: var(--primary-red);
            border: 2px solid #a00;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }

        .top { transform: rotateX(90deg) translateZ(100px); background: #ff4d4d !important; }
        .front { transform: translateZ(100px); }
        /* Add ribbon effect */
        .front::after { content: ''; position: absolute; left: 90px; width: 20px; height: 100%; background: var(--gold); }

        /* Video styling */
        #memorie-video {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: contain;
            background: black;
            z-index: 100;
        }

        /* Curtains */
        .curtain {
            position: fixed; top: 0; width: 50%; height: 100%;
            background: #800000;
            z-index: 200;
            transition: transform 2s ease-in-out;
            display: none;
            box-shadow: inset 0 0 50px #000;
        }
        .left-curtain { left: 0; border-right: 2px solid var(--gold); }
        .right-curtain { right: 0; border-left: 2px solid var(--gold); }

        /* Proposal Animation Simulation */
        #proposal-scene {
            display: none;
            position: fixed;
            z-index: 150;
            text-align: center;
        }

        #no-btn { position: absolute; transition: 0.2s; }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px var(--gold)); }
            50% { filter: drop-shadow(0 0 20px var(--gold)); }
        }
    </style>
</head>
<body>

    <div id="countdown">10</div>

    <div id="fireworks-overlay">
        <h1 class="beautified-text">HAPPY NEW YEAR 2026!</h1>
    </div>

    <div id="music-modal" class="modal">
        <h2>A special surprise awaits...</h2>
        <button onclick="startExperience()" style="padding: 10px 20px; cursor:pointer;">Turn On Music</button>
    </div>

    <div id="msg-modal" class="modal">
        <p id="personal-text"></p>
    </div>

    <div class="box-container" id="gift-container">
        <div class="gift-box" onclick="openBox()">
            <div class="front"></div>
            <div class="back" style="transform: rotateY(180deg) translateZ(100px);"></div>
            <div class="left" style="transform: rotateY(-90deg) translateZ(100px);"></div>
            <div class="right" style="transform: rotateY(90deg) translateZ(100px);"></div>
            <div class="top" id="box-top"></div>
            <div class="bottom" style="transform: rotateX(-90deg) translateZ(100px);"></div>
        </div>
        <p style="text-align:center; margin-top: 50px;">Tap the top to open!</p>
    </div>

    <video id="memorie-video" src="memorie.mp4"></video>

    <div id="l-curtain" class="curtain left-curtain"></div>
    <div id="r-curtain" class="curtain right-curtain"></div>

    <div id="proposal-scene">
        <div id="anime-placeholder" style="font-size: 100px;">👦💍👧</div>
        <h2 class="beautified-text">Will you marry me Sona?</h2>
        <button onclick="sayYes()" style="padding: 10px 30px; font-size: 20px;">YES</button>
        <button id="no-btn" onmouseover="moveNo()" style="padding: 10px 30px; font-size: 20px;">NO</button>
    </div>

    <audio id="bg-music" src="music.mp3"></audio>

    <script>
        const countdownEl = document.getElementById('countdown');
        let count = 10;

        // Start Countdown
        const timer = setInterval(() => {
            count--;
            countdownEl.innerText = count;
            if (count <= 0) {
                clearInterval(timer);
                showNewYear();
            }
        }, 1000);

        function showNewYear() {
            countdownEl.style.display = 'none';
            document.getElementById('fireworks-overlay').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('music-modal').style.display = 'block';
            }, 3000);
        }

        function startExperience() {
            document.getElementById('bg-music').play();
            document.getElementById('music-modal').style.display = 'none';
            
            const msgModal = document.getElementById('msg-modal');
            msgModal.style.display = 'block';
            const text = "Happy new year to most beautiful lady in the universe... (Long Message Here)... Now here is a little gift for my jaanu";
            document.getElementById('personal-text').innerText = text;

            setTimeout(() => {
                msgModal.style.opacity = '0';
                setTimeout(() => {
                    msgModal.style.display = 'none';
                    showGiftBox();
                }, 1000);
            }, 8000);
        }

        function showGiftBox() {
            document.getElementById('fireworks-overlay').style.display = 'none';
            document.getElementById('gift-container').style.display = 'block';
        }

        function openBox() {
            document.getElementById('box-top').style.transform = 'rotateX(120deg) translateZ(150px)';
            setTimeout(() => {
                document.getElementById('gift-container').style.display = 'none';
                playVideo();
            }, 2000);
        }

        function playVideo() {
            const vid = document.getElementById('memorie-video');
            vid.style.display = 'block';
            vid.play();
            vid.onended = () => {
                vid.style.display = 'none';
                showCurtains();
            };
        }

        function showCurtains() {
            document.getElementById('l-curtain').style.display = 'block';
            document.getElementById('r-curtain').style.display = 'block';
            
            setTimeout(() => {
                document.body.onclick = () => {
                    document.getElementById('l-curtain').style.transform = 'translateX(-100%)';
                    document.getElementById('r-curtain').style.transform = 'translateX(100%)';
                    showProposal();
                    document.body.onclick = null;
                };
            }, 1000);
        }

        function showProposal() {
            document.getElementById('proposal-scene').style.display = 'block';
        }

        function moveNo() {
            const btn = document.getElementById('no-btn');
            btn.style.top = Math.random() * 80 + 'vh';
            btn.style.left = Math.random() * 80 + 'vw';
        }

        function sayYes() {
            document.getElementById('no-btn').style.display = 'none';
            alert("She said YES! ❤️");
            // Here you would trigger the falling flowers and the final hug animation
            document.getElementById('anime-placeholder').innerText = "👩‍❤️‍👨";
        }
    </script>
</body>
</html>
